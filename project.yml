name: SleepRelay

options:
  bundleIdPrefix: app.sleeprelay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Internal: release
  Release: release

packages:
  SleepRelayCore:
    path: Packages/SleepRelayCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  SleepRelay:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Brand
    configFiles:
      Debug: Config/Base.xcconfig
      Internal: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: SleepRelayCore
    entitlements:
      path: App/SleepRelay.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sleeprelay.ios
        PRODUCT_NAME: Sleep Relay
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: true
      configs:
        Debug:
          SLEEP_RELAY_BUILD_CHANNEL: Development
        Internal:
          APP_DISPLAY_NAME: Sleep Relay Nightly
          SLEEP_RELAY_BUILD_CHANNEL: Nightly
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INTERNAL_TOOLS"
        Release:
          SLEEP_RELAY_BUILD_CHANNEL: Release
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EightSleepClientID: $(EIGHT_SLEEP_CLIENT_ID)
        EightSleepClientSecret: $(EIGHT_SLEEP_CLIENT_SECRET)
        SleepRelayBuildChannel: $(SLEEP_RELAY_BUILD_CHANNEL)
        SleepRelayGitCommit: $(SLEEP_RELAY_GIT_SHA)
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Sleep Relay reads selected sleep and heart metrics to identify gaps, show existing sources, and avoid duplicate resting-heart-rate imports.
        NSHealthUpdateUsageDescription: Sleep Relay writes only an Eight Sleep reported resting-heart-rate sample after you review and confirm it. It never writes Eight HRV as Apple Health SDNN or changes another app's samples.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  SleepRelay:
    build:
      targets:
        SleepRelay: all
    run:
      config: Debug
    archive:
      config: Release
  SleepRelay-Internal:
    build:
      targets:
        SleepRelay: all
    run:
      config: Internal
    archive:
      config: Internal
