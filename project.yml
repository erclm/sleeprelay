name: SleepRelay

options:
  bundleIdPrefix: app.sleeprelay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  SleepRelayCore:
    path: Packages/SleepRelayCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  SleepRelay:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - package: SleepRelayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sleeprelay.ios
        PRODUCT_NAME: Sleep Relay
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_EMIT_LOC_STRINGS: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sleep Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EightSleepClientID: $(EIGHT_SLEEP_CLIENT_ID)
        EightSleepClientSecret: $(EIGHT_SLEEP_CLIENT_SECRET)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

schemes:
  SleepRelay:
    build:
      targets:
        SleepRelay: all
    run:
      config: Debug
    archive:
      config: Release
