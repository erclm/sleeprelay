name: TestFlight

on:
  push:
    branches:
      - nightly
  workflow_dispatch:
    inputs:
      channel:
        description: Distribution lane
        required: true
        default: internal
        type: choice
        options:
          - internal
          - release

concurrency:
  group: testflight-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Select channel and build number
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          channel=internal
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            channel="${REQUESTED_CHANNEL}"
          fi
          if [[ "${channel}" == "release" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release candidates must be dispatched from main." >&2
            exit 1
          fi
          {
            echo "SLEEP_RELAY_CHANNEL=${channel}"
            echo "SLEEP_RELAY_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 5))"
            echo "SLEEP_RELAY_GIT_SHA=${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Configure private app values
        env:
          EIGHT_SLEEP_CLIENT_ID: ${{ secrets.EIGHT_SLEEP_CLIENT_ID }}
          EIGHT_SLEEP_CLIENT_SECRET: ${{ secrets.EIGHT_SLEEP_CLIENT_SECRET }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in EIGHT_SLEEP_CLIENT_ID EIGHT_SLEEP_CLIENT_SECRET APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing testflight environment secret: ${name}" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s\n' \
            "EIGHT_SLEEP_CLIENT_ID = ${EIGHT_SLEEP_CLIENT_ID}" \
            "EIGHT_SLEEP_CLIENT_SECRET = ${EIGHT_SLEEP_CLIENT_SECRET}" \
            "DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}" \
            > Config/Local.xcconfig

      - name: Install App Store signing credentials
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in ASC_API_KEY_BASE64 ASC_KEY_ID DISTRIBUTION_CERTIFICATE_P12_BASE64 DISTRIBUTION_CERTIFICATE_PASSWORD PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing testflight environment secret: ${name}" >&2
              exit 1
            fi
          done
          umask 077
          keychain_path="${RUNNER_TEMP}/sleeprelay-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="${RUNNER_TEMP}/sleeprelay-distribution.p12"
          profile_path="${RUNNER_TEMP}/sleeprelay.mobileprovision"
          api_key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "${ASC_API_KEY_BASE64}" | base64 -D > "${api_key_path}"
          printf '%s' "${DISTRIBUTION_CERTIFICATE_P12_BASE64}" | base64 -D > "${certificate_path}"
          printf '%s' "${PROVISIONING_PROFILE_BASE64}" | base64 -D > "${profile_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          profile_plist="${RUNNER_TEMP}/sleeprelay-profile.plist"
          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${profile_plist}")"
          installed_profile="${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          mkdir -p "$(dirname "${installed_profile}")"
          cp "${profile_path}" "${installed_profile}"

          {
            echo "ASC_KEY_PATH=${api_key_path}"
            echo "SIGNING_KEYCHAIN_PATH=${keychain_path}"
            echo "INSTALLED_PROFILE_PATH=${installed_profile}"
          } >> "${GITHUB_ENV}"

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_SIGNING_CERTIFICATE: Apple Distribution
          ASC_PROVISIONING_PROFILE: Sleep Relay App Store
          ASC_BUNDLE_ID: app.sleeprelay.ios
        run: Scripts/upload-testflight.sh --channel "${SLEEP_RELAY_CHANNEL}"

      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true
          fi
          rm -f -- \
            "${RUNNER_TEMP}"/AuthKey_*.p8 \
            "${RUNNER_TEMP}/sleeprelay-distribution.p12" \
            "${RUNNER_TEMP}/sleeprelay.mobileprovision" \
            "${RUNNER_TEMP}/sleeprelay-profile.plist" \
            "${INSTALLED_PROFILE_PATH:-${RUNNER_TEMP}/missing-profile}"
