name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - nightly
      - "elmcodex/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Core tests and app builds
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Test Release and Internal configurations
        run: Scripts/ci.sh

      - name: Verify generated project is committed
        run: git diff --exit-code -- SleepRelay.xcodeproj/project.pbxproj App/Info.plist
